<style>
/* ==========================================================================
   Sistem Tempahan Bilik Khas — corporate theme
   ========================================================================== */

:root,
[data-bs-theme="light"] {
    --tb-navy: #0b1b3f;
    --tb-navy-2: #12275a;
    --tb-accent: #3b82f6;
    --tb-bg: #f3f5fa;
    --tb-surface: #ffffff;
    --tb-border: #e4e8f1;
    --tb-muted: #64748b;
    --tb-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 16px rgba(15, 23, 42, .04);
    --tb-shadow-lg: 0 12px 32px rgba(15, 23, 42, .10);
    --tb-free: #ecfdf5;
    --tb-free-b: #a7f3d0;
    --tb-past: #f1f5f9;
    --tb-sidebar-w: 268px;

    --bs-primary: #1d4ed8;
    --bs-primary-rgb: 29, 78, 216;
    --bs-link-color: #1d4ed8;
    --bs-link-color-rgb: 29, 78, 216;
    --bs-link-hover-color: #1e40af;
    --bs-body-font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --bs-body-bg: var(--tb-bg);
    --bs-border-color: var(--tb-border);
    --bs-border-radius: .6rem;
    --bs-border-radius-lg: .8rem;
}

[data-bs-theme="dark"] {
    --tb-bg: #0b1120;
    --tb-surface: #111a2e;
    --tb-border: #1f2a44;
    --tb-muted: #94a3b8;
    --tb-shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --tb-shadow-lg: 0 12px 32px rgba(0, 0, 0, .45);
    --tb-free: rgba(16, 185, 129, .08);
    --tb-free-b: rgba(16, 185, 129, .35);
    --tb-past: rgba(148, 163, 184, .06);
    --bs-body-bg: var(--tb-bg);
    --bs-body-color: #dbe3f0;
    --bs-border-color: var(--tb-border);
    --bs-secondary-bg: #16213a;
    --bs-tertiary-bg: #131d33;
    --bs-primary: #3b82f6;
    --bs-primary-rgb: 59, 130, 246;
    --bs-link-color: #60a5fa;
    --bs-link-color-rgb: 96, 165, 250;
    --bs-link-hover-color: #93c5fd;
}

body { background: var(--tb-bg); font-size: .925rem; -webkit-font-smoothing: antialiased; }
.xsmall { font-size: .75rem; }
.min-w-0 { min-width: 0; }
.ls-1 { letter-spacing: .08em; }
a { text-decoration: none; }
.fw-medium { font-weight: 500; }

/* ---------- Buttons & form tweaks ---------- */
.btn { font-weight: 500; border-radius: .55rem; }
.btn-primary { --bs-btn-bg: #1d4ed8; --bs-btn-border-color: #1d4ed8; --bs-btn-hover-bg: #1e40af; --bs-btn-hover-border-color: #1e40af; --bs-btn-active-bg: #1e3a8a; box-shadow: 0 2px 8px rgba(29, 78, 216, .25); }
.btn-light { --bs-btn-bg: var(--tb-surface); --bs-btn-border-color: var(--tb-border); --bs-btn-hover-bg: var(--bs-secondary-bg); --bs-btn-hover-border-color: var(--tb-border); --bs-btn-color: var(--bs-body-color); --bs-btn-hover-color: var(--bs-body-color); }
.btn-icon { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--bs-body-color); border: 1px solid transparent; }
.btn-icon:hover { background: var(--bs-secondary-bg); }
.form-control, .form-select { border-color: var(--tb-border); background-color: var(--tb-surface); }
.form-control:focus, .form-select:focus { border-color: #93c5fd; box-shadow: 0 0 0 .2rem rgba(59, 130, 246, .18); }
.form-label { margin-bottom: .35rem; font-size: .875rem; }
.input-icon { position: relative; }
.input-icon > i { position: absolute; left: .8rem; top: 50%; transform: translateY(-50%); color: var(--tb-muted); pointer-events: none; z-index: 2; }
.input-icon > .form-control { padding-left: 2.3rem; }
.btn-reveal { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--tb-muted); padding: .25rem .5rem; }

/* ---------- Soft badges ---------- */
.badge { font-weight: 600; padding: .38em .65em; border-radius: 6px; }
.badge-soft-primary { background: rgba(29, 78, 216, .1); color: #1d4ed8; }
.badge-soft-success { background: rgba(22, 163, 74, .12); color: #15803d; }
.badge-soft-warning { background: rgba(245, 158, 11, .15); color: #b45309; }
.badge-soft-danger { background: rgba(220, 38, 38, .1); color: #b91c1c; }
.badge-soft-secondary { background: rgba(100, 116, 139, .12); color: #475569; }
.badge-soft-info { background: rgba(8, 145, 178, .12); color: #0e7490; }
[data-bs-theme="dark"] .badge-soft-primary { color: #93c5fd; background: rgba(59, 130, 246, .18); }
[data-bs-theme="dark"] .badge-soft-success { color: #86efac; }
[data-bs-theme="dark"] .badge-soft-warning { color: #fcd34d; }
[data-bs-theme="dark"] .badge-soft-danger { color: #fca5a5; }
[data-bs-theme="dark"] .badge-soft-secondary { color: #cbd5e1; }
[data-bs-theme="dark"] .badge-soft-info { color: #67e8f9; }

/* ---------- Sidebar ---------- */
.sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--tb-sidebar-w); z-index: 1040;
    background: linear-gradient(180deg, var(--tb-navy) 0%, #0a1733 100%);
    color: #cbd5e1; display: flex; flex-direction: column; transition: transform .25s ease;
}
.brand { display: flex; align-items: center; gap: .75rem; padding: 1.25rem 1.25rem 1rem; color: #fff; }
.brand:hover { color: #fff; }
.brand-logo {
    width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; font-size: 1.15rem; box-shadow: 0 6px 16px rgba(59, 130, 246, .35);
}
.brand-logo.lg { width: 52px; height: 52px; font-size: 1.5rem; border-radius: 14px; display: flex; }
.brand-text { line-height: 1.2; min-width: 0; }
.brand-text strong { display: block; font-size: .9rem; font-weight: 700; }
.brand-text small { display: block; font-size: .72rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-nav { flex: 1; overflow-y: auto; padding: .5rem .75rem 1rem; }
.nav-section { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #64748b; padding: 1.1rem .75rem .45rem; }
.sidebar .nav-link {
    display: flex; align-items: center; gap: .75rem; padding: .6rem .75rem; border-radius: .6rem; color: #cbd5e1; font-weight: 500; font-size: .875rem; margin-bottom: 2px;
}
.sidebar .nav-link i { font-size: 1.05rem; width: 20px; text-align: center; opacity: .85; }
.sidebar .nav-link:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.sidebar .nav-link.active { background: linear-gradient(90deg, rgba(59, 130, 246, .28), rgba(59, 130, 246, .08)); color: #fff; box-shadow: inset 3px 0 0 #60a5fa; }
.sidebar .nav-link.active i { color: #93c5fd; opacity: 1; }
.nav-badge { margin-left: auto; background: #f59e0b; color: #111827; font-size: .7rem; font-weight: 700; padding: .1rem .45rem; border-radius: 99px; }
.sidebar-footer { padding: .75rem; border-top: 1px solid rgba(255, 255, 255, .06); }
.sidebar-backdrop { display: none; }

/* ---------- Main layout ---------- */
.main { margin-left: var(--tb-sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
    position: sticky; top: 0; z-index: 1030; height: 68px; display: flex; align-items: center; gap: 1rem; padding: 0 1.75rem;
    background: color-mix(in srgb, var(--tb-bg) 82%, transparent); backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--tb-border);
}
.content { flex: 1; padding: 1.75rem; max-width: 1600px; width: 100%; }
.app-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; padding: 1rem 1.75rem; font-size: .8rem; color: var(--tb-muted); border-top: 1px solid var(--tb-border); }

.user-chip { display: flex; align-items: center; gap: .6rem; padding: .3rem .6rem .3rem .3rem; border-radius: 99px; border: 1px solid var(--tb-border); background: var(--tb-surface); }
.avatar {
    width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: linear-gradient(135deg, #1d4ed8, #7c3aed); color: #fff; font-size: .78rem; font-weight: 700;
}
.avatar-sm { width: 30px; height: 30px; font-size: .7rem; }
.avatar-xl { width: 84px; height: 84px; font-size: 1.8rem; display: flex; }
.notif-dot { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: #ef4444; color: #fff; font-size: .65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--tb-bg); }
.notif-menu { width: 340px; border: 1px solid var(--tb-border); border-radius: .8rem; overflow: hidden; }
.notif-list { max-height: 380px; overflow-y: auto; }
.notif-item { display: block; padding: .7rem 1rem; border-bottom: 1px solid var(--tb-border); color: inherit; }
.notif-item:hover { background: var(--bs-secondary-bg); color: inherit; }
.notif-item.unread { background: rgba(59, 130, 246, .06); box-shadow: inset 3px 0 0 #3b82f6; }
.notif-unread { background: rgba(59, 130, 246, .05); }
.notif-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--bs-secondary-bg); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }

/* ---------- Page head ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.page-title { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.page-subtitle { color: var(--tb-muted); margin: .25rem 0 0; }
.page-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ---------- Cards ---------- */
.card { background: var(--tb-surface); border: 1px solid var(--tb-border); border-radius: .9rem; box-shadow: var(--tb-shadow); }
.card-header { background: transparent; border-bottom: 1px solid var(--tb-border); padding: .95rem 1.25rem; }
.card-footer { background: transparent; border-top: 1px solid var(--tb-border); padding: .75rem 1.25rem; }
.card-title { font-size: 1rem; font-weight: 700; margin: 0; display: flex; align-items: center; }
.card > .list-group-flush > .list-group-item { background: transparent; }
.table { --bs-table-bg: transparent; margin-bottom: 0; }
.table > thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--tb-muted); font-weight: 700; background: var(--bs-tertiary-bg); border-bottom-width: 1px; white-space: nowrap; padding: .7rem .75rem; }
.table > tbody td { padding: .75rem; }
.table > :not(caption) > * > * { border-color: var(--tb-border); }
.table td:first-child, .table th:first-child { padding-left: 1.25rem; }
.table td:last-child, .table th:last-child { padding-right: 1.25rem; }

.hero-card {
    border-radius: 1.1rem; padding: 1.75rem 2rem; position: relative; overflow: hidden;
    background: radial-gradient(circle at 85% -20%, rgba(96, 165, 250, .55), transparent 45%), linear-gradient(120deg, #0b1b3f 0%, #1e3a8a 60%, #1d4ed8 100%);
    box-shadow: 0 16px 40px rgba(30, 58, 138, .25);
}
.hero-card::after {
    content: ""; position: absolute; right: -60px; bottom: -80px; width: 260px; height: 260px; border-radius: 50%;
    border: 40px solid rgba(255, 255, 255, .05);
}
.hero-card .row { position: relative; z-index: 1; }

.stat-card {
    display: flex; align-items: center; gap: 1rem; padding: 1.15rem 1.25rem; height: 100%;
    background: var(--tb-surface); border: 1px solid var(--tb-border); border-radius: .9rem; box-shadow: var(--tb-shadow); color: inherit; transition: transform .15s, box-shadow .15s;
}
a.stat-card:hover { transform: translateY(-2px); box-shadow: var(--tb-shadow-lg); color: inherit; }
.stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; }
.stat-value { font-size: 1.6rem; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
.stat-label { font-size: .8rem; color: var(--tb-muted); font-weight: 500; }
.stat-card-sm { padding: .9rem 1rem; gap: .75rem; }
.stat-card-sm .stat-icon { width: 40px; height: 40px; font-size: 1.1rem; }
.stat-card-sm .stat-value { font-size: 1.3rem; }

.empty-state { text-align: center; color: var(--tb-muted); padding: 2rem 1rem; }
.empty-state i { font-size: 2.2rem; display: block; margin-bottom: .5rem; opacity: .5; }
.empty-state p { margin-bottom: .75rem; }

.room-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c, #1d4ed8); margin-right: .5rem; vertical-align: middle; flex-shrink: 0; }
.legend-box { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: .35rem; vertical-align: -1px; border: 1px solid rgba(0, 0, 0, .08); }
.bg-free { background: var(--tb-free); border-color: var(--tb-free-b); }
.bg-busy { background: #3b82f6; }
.bg-pending { background: repeating-linear-gradient(45deg, #fbbf24, #fbbf24 3px, #fde68a 3px, #fde68a 6px); }
.bg-selected { background: #16a34a; }
.bg-closed { background: #94a3b8; }

.date-tile {
    width: 50px; height: 54px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0;
    background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
}
.date-tile span { font-size: .65rem; font-weight: 700; text-transform: uppercase; }
.date-tile strong { font-size: 1.25rem; line-height: 1; }

/* Today timeline */
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline-item { display: flex; gap: 1rem; padding-bottom: .9rem; position: relative; }
.timeline-item:not(:last-child)::before { content: ""; position: absolute; left: 58px; top: 26px; bottom: 0; width: 2px; background: var(--tb-border); }
.timeline-time { width: 48px; font-weight: 700; font-size: .85rem; text-align: right; flex-shrink: 0; padding-top: .55rem; }
.timeline-time small { display: block; font-weight: 500; color: var(--tb-muted); font-size: .72rem; }
.timeline-body { flex: 1; border: 1px solid var(--tb-border); border-left: 4px solid var(--c); border-radius: .6rem; padding: .6rem .9rem; background: var(--tb-surface); position: relative; margin-left: 12px; }
.timeline-body::before { content: ""; position: absolute; left: -23px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 3px solid var(--tb-surface); box-shadow: 0 0 0 1px var(--tb-border); }
.timeline-item.past { opacity: .55; }
.timeline-item.live .timeline-body { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }
.live-badge { animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { opacity: .55; } }

.free-list { max-height: 420px; overflow-y: auto; }

/* ---------- Booking form ---------- */
.step-no { width: 26px; height: 26px; border-radius: 50%; background: #1d4ed8; color: #fff; font-size: .8rem; display: inline-flex; align-items: center; justify-content: center; margin-right: .6rem; }
.period-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: .5rem; }
.period-chip {
    border: 1px solid var(--tb-border); background: var(--tb-surface); border-radius: .6rem; padding: .5rem .4rem; text-align: center; transition: all .12s; color: inherit;
}
.period-chip:hover:not(.selected):not(.busy):not(.past) { border-color: #93c5fd; background: rgba(59, 130, 246, .06); }
.period-chip .pc-label { display: block; font-weight: 700; font-size: .8rem; }
.period-chip .pc-time { display: block; font-size: .7rem; color: var(--tb-muted); }
.period-chip.is-break { background: repeating-linear-gradient(45deg, transparent, transparent 6px, var(--bs-tertiary-bg) 6px, var(--bs-tertiary-bg) 12px); }
.period-chip.selected { background: #16a34a; border-color: #16a34a; color: #fff; }
.period-chip.selected .pc-time { color: rgba(255, 255, 255, .85); }
.period-chip.anchor { box-shadow: 0 0 0 3px rgba(22, 163, 74, .3); }
.period-chip.busy { background: rgba(239, 68, 68, .08); border-color: rgba(239, 68, 68, .3); color: #b91c1c; cursor: not-allowed; }
.period-chip.busy .pc-time { color: #ef4444; }
.period-chip.busy.selected { background: #dc2626; border-color: #dc2626; color: #fff; }
.period-chip.past { opacity: .4; cursor: not-allowed; }
.duration-box { border: 1px dashed var(--tb-border); border-radius: .55rem; padding: .45rem .75rem; color: var(--tb-muted); font-weight: 600; font-size: .875rem; height: 38px; display: flex; align-items: center; gap: .4rem; }
.repeat-box { border: 1px solid var(--tb-border); border-radius: .7rem; padding: .85rem 1rem; background: var(--bs-tertiary-bg); }
.repeat-options { display: none; }
.repeat-box.on .repeat-options { display: block; }
.check-result { border-radius: .7rem; padding: .8rem 1rem; font-size: .875rem; display: flex; gap: .6rem; align-items: flex-start; }
.check-result.ok { background: rgba(22, 163, 74, .1); color: #15803d; border: 1px solid rgba(22, 163, 74, .25); }
.check-result.bad { background: rgba(220, 38, 38, .08); color: #b91c1c; border: 1px solid rgba(220, 38, 38, .25); }
.check-result.loading { background: var(--bs-tertiary-bg); color: var(--tb-muted); }
[data-bs-theme="dark"] .check-result.ok { color: #86efac; }
[data-bs-theme="dark"] .check-result.bad { color: #fca5a5; }
.check-result ul { margin: .25rem 0 0; padding-left: 1.1rem; }

.room-info { overflow: hidden; }
.room-info-banner { height: 84px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: rgba(255, 255, 255, .9); background: linear-gradient(135deg, var(--c, #1d4ed8), color-mix(in srgb, var(--c, #1d4ed8) 55%, #0b1b3f)); }
.facility-tag { font-size: .72rem; padding: .25rem .55rem; border-radius: 6px; background: var(--bs-tertiary-bg); border: 1px solid var(--tb-border); color: var(--bs-body-color); }

.day-timeline { position: relative; }
.dt-grid { position: relative; margin-left: 44px; border-left: 1px solid var(--tb-border); }
.dt-hour { position: relative; border-top: 1px solid var(--tb-border); }
.dt-hour span { position: absolute; left: -44px; top: -8px; font-size: .68rem; color: var(--tb-muted); width: 38px; text-align: right; }
.dt-block { position: absolute; left: 6px; right: 6px; border-radius: 6px; padding: 2px 8px; font-size: .72rem; overflow: hidden; line-height: 1.3; color: #fff; background: #3b82f6; border: 1px solid rgba(0, 0, 0, .08); }
.dt-block.pending { background: repeating-linear-gradient(45deg, #f59e0b, #f59e0b 6px, #fbbf24 6px, #fbbf24 12px); color: #111827; }
.dt-block.mine-sel { background: rgba(22, 163, 74, .85); border: 2px dashed #14532d; z-index: 2; }
.dt-block.mine-sel.clash { background: rgba(220, 38, 38, .85); border-color: #7f1d1d; }
.dt-now { position: absolute; left: -4px; right: 0; height: 2px; background: #ef4444; z-index: 3; }
.dt-now::before { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
.dt-closed { padding: 1rem; text-align: center; border-radius: .6rem; background: var(--bs-tertiary-bg); color: var(--tb-muted); }

/* ---------- Availability grid ---------- */
.avail-wrap { max-height: 70vh; }
.avail-grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .8rem; }
.avail-grid th, .avail-grid td { border-bottom: 1px solid var(--tb-border); border-right: 1px solid var(--tb-border); }
.avail-grid thead th { position: sticky; top: 0; z-index: 2; background: var(--bs-tertiary-bg); text-align: center; padding: .5rem .3rem; font-weight: 700; min-width: 64px; white-space: nowrap; }
.avail-grid thead th small { display: block; font-weight: 500; color: var(--tb-muted); font-size: .68rem; }
.avail-grid thead th.is-now { background: #1d4ed8; color: #fff; }
.avail-grid thead th.is-now small { color: rgba(255, 255, 255, .8); }
.avail-grid .sticky-col { position: sticky; left: 0; z-index: 1; background: var(--tb-surface); min-width: 210px; text-align: left; padding: .55rem 1rem; font-weight: 600; }
.avail-grid thead .sticky-col { z-index: 3; background: var(--bs-tertiary-bg); }
.avail-grid td { height: 46px; text-align: center; padding: 0; }
.avail-grid td a { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 45px; }
.cell-free { background: var(--tb-free); }
.cell-free a { color: transparent; font-size: 1.2rem; }
.cell-free:hover { background: #d1fae5; }
.cell-free:hover a { color: #047857; }

    var DAYS = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
    var MONTHS = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
    var MONTHS_SHORT = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
    var fmtDate = function (iso, withDay, short) {
        if (!iso) return '-';

        if (isNaN(d)) return esc(iso);
        return (withDay ? DAYS[d.getDay()] + ', ' : '') + d.getDate() + ' ' + (short ? MONTHS_SHORT : MONTHS)[d.getMonth()] + ' ' + d.getFullYear();

    var dayName = function (iso) { return DAYS[new Date(iso + 'T00:00:00').getDay()]; };
    var duration = function (a, b) {

    };
    var timeAgo = function (s) {
        var diff = (Date.now() - new Date(String(s).replace(' ', 'T')).getTime()) / 1000;
        if (diff < 60) return 'baru sahaja';
        if (diff < 3600) return Math.floor(diff / 60) + ' minit lalu';
        if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu';

    var csvDownload = function (filename, header, rows) {
        var cell = function (v) {
            v = v == null ? '' : String(v);
            if (/^[=+\-@]/.test(v)) v = "'" + v;
            return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
        };
        var csv = '﻿' + [header].concat(rows).map(function (r) { return r.map(cell).join(','); }).join('\r\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = filename;

    var pager = function (page, pages, onGo) {
        if (pages <= 1) return '';

        var html = '<nav><ul class="pagination pagination-sm mb-0">', prev = 0;
        nums.forEach(function (n) {
            if (prev && n > prev + 1) html += '<li class="page-item disabled"><span class="page-link">…</span></li>';
            html += '<li class="page-item' + (n === page ? ' active' : '') + '"><a class="page-link" href="#" data-page="' + n + '">' + n + '</a></li>';

    /* ------------------------------------------------------------------
     * API client — google.script.run when served from Apps Script,
     * otherwise fetch() to the Web App URL (e.g. from Firebase Hosting)
     * ------------------------------------------------------------------ */
    /* ------------------------------------------------------------------
     * Which school is this? booking.akmalsys.com/<kod> on the web,
     * or ?s=<kod> when the app is served straight from Apps Script.
     * ------------------------------------------------------------------ */
    var CFG = window.APP_CONFIG || {};
    var IN_GAS = !!(window.google && google.script && google.script.run);
    var NOT_SCHOOL = { '': 1, 'index.html': 1, 'platform': 1, 'display.html': 1 };
    function detectSchool() {
        if (IN_GAS) return String(CFG.school || '').toLowerCase();
        var seg = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '').toLowerCase();
        if (!NOT_SCHOOL[seg]) return seg;
        var q = new URLSearchParams(location.search).get('s');
        return q ? q.toLowerCase() : '';
    }
    function isPlatformPage() {
        return IN_GAS ? !!CFG.platform : /^\/platform\/?$/.test(location.pathname);
    }
    function schoolLink(slug) {
        return IN_GAS ? CFG.gasUrl + '?s=' + encodeURIComponent(slug) : '/' + encodeURIComponent(slug);
    }
    function homeLink() {
        return IN_GAS ? CFG.gasUrl : '/';
    }
    /** Navigate the whole window (the Apps Script app runs inside an iframe). */
    function goTop(url) {
        if (IN_GAS) window.open(url, '_top'); else location.href = url;
    }
    S.school = detectSchool();

    function tokenKey() { return 'tb-token:' + S.school; }
    function getToken() {
        try { return localStorage.getItem(tokenKey()) || sessionStorage.getItem(tokenKey()) || S.token || ''; } catch (e) { return S.token || ''; }
    }
    function setToken(token, remember) {
        S.token = token || '';
        try {
            localStorage.removeItem(tokenKey());
            sessionStorage.removeItem(tokenKey());
            if (token) (remember ? localStorage : sessionStorage).setItem(tokenKey(), token);
        } catch (e) { /* storage blocked: keep token in memory only */ }
    }

    function transport(payload) {
        var gsr = window.google && google.script && google.script.run;
        if (gsr) {
            return new Promise(function (resolve, reject) {
                gsr.withSuccessHandler(function (s) { resolve(JSON.parse(s)); })
                    .withFailureHandler(function (e) { reject(new Error('Ralat pelayan: ' + (e && e.message || e))); })
                    .api(JSON.stringify(payload));
            });
        }
        return fetch(window.APP_CONFIG.gasUrl, {
            method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow',
        }).then(function (r) {
            if (!r.ok) throw new Error('Pelayan tidak dapat dihubungi (' + r.status + ').');
            return r.json();
        }, function () { throw new Error('Tidak dapat menghubungi pelayan. Semak sambungan Internet anda.'); });
    }

    function api(action, data, opts) {
        opts = opts || {};
        var payload = { action: action, data: data || {} };
        if (opts.platform) {
            payload.token = opts.token || undefined;
        } else {
            payload.school = S.school;
            payload.token = opts.public ? undefined : getToken() || undefined;
        }
        return transport(payload).then(function (j) {
            if (j.meta) setMeta(j.meta);
            if (!j.ok) {
                var e = new Error(j.error || 'Ralat');
                e.code = j.code; e.info = j.info;
                if (j.code === 'AUTH' && !opts.public && !opts.platform && S.user) {
                    setToken('');
                    S.user = null;
                    toast(j.error, 'warning');
                    showLogin();
                }
                throw e;
            }
            return j.data;
        });
    }

        $('[name=ic]', a).type = 'password';
        $('[data-reveal]', a).onclick = function () { var i = $('[name=ic]', a); i.type = i.type === 'password' ? 'text' : 'password'; };
        $('#backLogin', a).onclick = showLogin;
        $('#regForm', a).onsubmit = function (e) {
            e.preventDefault();
            var btn = $('button.btn-primary', this);
            busy(btn, true);
            api('register', formData(this), { public: true }).then(function () {
                showMessage('hourglass-split', 'Pendaftaran dihantar', 'Akaun anda akan muncul dalam senarai nama selepas disahkan oleh pentadbir. Selepas itu, log masuk dengan No. KP yang anda daftarkan.',
                    '<button class="btn btn-primary mt-2" id="backLogin2">Kembali ke log masuk</button>');

                busy(btn, false);
                $('#regAlert', a).innerHTML = '<div class="alert alert-danger py-2 small">' + esc(err.message) + '</div>';
            });

    }

    function logout() {
        api('logout', {}).catch(function () { /* ignore */ }).then(function () {
            setToken('');
            S.user = null;
            history.replaceState(null, '', location.pathname + location.search);
            return loadConfig();
        }).then(showLogin, showLogin);
    }

    /* ------------------------------------------------------------------
     * Session bootstrap
     * ------------------------------------------------------------------ */
    function loadConfig() {
        return api('config', {}, { public: true }).then(function (c) {
            S.teachers = c.teachers;
            S.settings = Object.assign(S.settings, c);
            applySettings();
            try { localStorage.setItem('tb-last-school', JSON.stringify({ slug: S.school, name: c.school_name })); } catch (e) { /* ignore */ }
        });
    }

    /* ------------------------------------------------------------------
     * Landing page (no school in the URL): ask for the school code.
     * The list of schools is never shown.
     * ------------------------------------------------------------------ */
    function showLanding(errorMsg) {
        var last = null;
        try { last = JSON.parse(localStorage.getItem('tb-last-school') || 'null'); } catch (e) { /* ignore */ }
        S.settings.system_name = S.settings.system_name || CFG.platformName || 'Sistem Tempahan Bilik Khas';
        var a = showAuth(
            (last && last.slug && !errorMsg ? '<a href="' + esc(schoolLink(last.slug)) + '" class="continue-school mb-4" id="continueSchool"><span class="small text-body-secondary">Teruskan ke</span><strong>' + esc(last.name || last.slug) +
                '</strong><i class="bi bi-arrow-right-circle-fill"></i></a><div class="text-center small text-body-secondary mb-3">atau masukkan kod sekolah lain</div>'
                : '<h2 class="h3 fw-bold mb-1">Selamat datang 👋</h2><p class="text-body-secondary mb-4">Masukkan kod sekolah anda untuk log masuk.</p>') +
            (errorMsg ? '<div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-circle me-1"></i>' + esc(errorMsg) + '</div>' : '') +
            '<form id="codeForm" autocomplete="off"><label class="form-label fw-semibold" for="schoolCode">Kod sekolah</label>' +
            '<div class="input-icon mb-3"><i class="bi bi-building"></i><input class="form-control form-control-lg text-lowercase" id="schoolCode" required placeholder="cth. smkabc"></div>' +
            '<button class="btn btn-primary btn-lg w-100 fw-semibold">Teruskan <i class="bi bi-arrow-right ms-1"></i></button></form>' +
            '<p class="text-center xsmall text-body-tertiary mt-4 mb-0">Tidak tahu kod sekolah? Tanya pentadbir sistem di sekolah anda, atau gunakan pautan yang mereka kongsikan.</p>');
        var cont = $('#continueSchool', a);
        if (cont) cont.onclick = function (e) { e.preventDefault(); goTop(schoolLink(last.slug)); };
        $('#codeForm', a).onsubmit = function (e) {
            e.preventDefault();
            var code = $('#schoolCode', a).value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            if (code) goTop(schoolLink(code));
        };
    }

    function startSession() {
        return api('session').then(function (d) {
            S.settings = Object.assign(d.settings || {}, { logo: S.settings.logo || '' });
            applySettings();
            S.user = d.user;
            S.rooms = d.rooms;
            S.periods = d.periods;
            S.today = d.today;
            showShell();
        }).catch(function (err) {
            if (err.code === 'AUTH') { setToken(''); return loadConfig().then(showLogin); }
            showMessage('wifi-off', 'Tidak dapat memuatkan sistem', esc(err.message), '<button class="btn btn-primary mt-2" onclick="location.reload()">Cuba lagi</button>');
        });
    }

    function applySettings() {
        $$('[data-setting]').forEach(function (el) { el.textContent = S.settings[el.dataset.setting] || ''; });
        document.title = S.settings.system_name || 'Tempahan Bilik Khas';
        var side = $('#sidebarLogo');
        if (side) side.outerHTML = brandLogo().replace('<span class="brand-logo', '<span id="sidebarLogo" class="brand-logo');
        var icon = document.querySelector('link[rel="icon"]');
        if (icon && S.settings.logo) icon.href = S.settings.logo;
    }

    function setLogo(logo) {
        S.settings.logo = logo || '';
        applySettings();
    }

    function refreshSession() {
        return api('session').then(function (d) {
            S.settings = Object.assign(d.settings, { logo: S.settings.logo || '' }); S.rooms = d.rooms; S.periods = d.periods; S.user = d.user;
            applySettings();
            renderNav();
        });
    }

    /* ------------------------------------------------------------------
     * Shell (sidebar / topbar)
     * ------------------------------------------------------------------ */
    function navItems() {
        var items = [
            { section: 'Utama' },
            ['dashboard', 'Papan Pemuka', 'grid-1x2'], ['book', 'Tempah Bilik', 'plus-square'], ['availability', 'Semak Kekosongan', 'search'],
            ['calendar', 'Jadual Tempahan', 'calendar3'], ['my-bookings', 'Tempahan Saya', 'journal-bookmark'], ['rooms', 'Senarai Bilik Khas', 'door-open'],
        ];
        if (S.user.role === 'admin') {
            items = items.concat([{ section: 'Pentadbiran' },
                ['admin/bookings', 'Rekod Tempahan', 'clipboard-data'], ['admin/rooms', 'Urus Bilik Khas', 'building-gear'],
                ['admin/users', 'Daftar & Urus Guru', 'people'], ['admin/closures', 'Penutupan & Cuti', 'calendar-x'],
                ['admin/periods', 'Waktu Persekolahan', 'clock'], ['admin/reports', 'Laporan & Analitik', 'bar-chart-line'],
                ['admin/settings', 'Tetapan Sistem', 'gear'], ['admin/audit', 'Log Audit', 'shield-check']]);
        }
        return items;
    }

    function renderNav(active) {
        active = active || S.active;
        var html = '';
        navItems().forEach(function (it) {
            if (it.section) { html += '<div class="nav-section">' + esc(it.section) + '</div>'; return; }
            var badge = '';
            if (it[0] === 'admin/bookings' && S.meta.pending) badge = '<span class="nav-badge">' + S.meta.pending + '</span>';
            if (it[0] === 'admin/users' && S.meta.pendingUsers) badge = '<span class="nav-badge">' + S.meta.pendingUsers + '</span>';
            html += '<a href="#/' + it[0] + '" class="nav-link' + (active === it[0] ? ' active' : '') + '"><i class="bi bi-' + it[2] + '"></i><span>' + esc(it[1]) + '</span>' + badge + '</a>';
        });
        $('#sideNav').innerHTML = html;
    }

    function setMeta(meta) {
        S.meta = meta || {};
        var d = $('#notifDot');
        if (d) {
            d.hidden = !S.meta.unread;
            d.textContent = S.meta.unread > 9 ? '9+' : (S.meta.unread || '');
        }
        if (S.user) renderNav();
    }

    function showShell() {
        $('#boot').hidden = true;
        $('#auth').hidden = true;
        $('#shell').hidden = false;
        var u = S.user;
        $('#userChip').innerHTML = (u.photo ? '<img class="user-photo" src="' + esc(u.photo) + '" alt="" referrerpolicy="no-referrer">' : '<span class="avatar">' + esc(initials(u.name)) + '</span>') +
            '<span class="d-none d-md-inline text-start lh-sm"><span class="d-block fw-semibold small">' + esc(u.name) + '</span><span class="d-block xsmall text-body-secondary">' +
            (u.role === 'admin' ? 'Pentadbir' : 'Guru') + '</span></span><i class="bi bi-chevron-down small d-none d-md-inline"></i>';
        $('#todayLabel').textContent = fmtDate(todayIso(), true);
        $('#year').textContent = new Date().getFullYear();
        $$('[data-logout]').forEach(function (b) { b.onclick = logout; });
        $('#displayLink').href = displayUrl();
        renderNav();
        if (!S.routerBound) { window.addEventListener('hashchange', route); S.routerBound = true; }
        route();
    }

    function loadNotifMenu() {
        var list = $('#notifList');
        list.innerHTML = '<div class="text-center py-3"><span class="spinner-border spinner-border-sm"></span></div>';
        api('notifications', { limit: 6 }).then(function (rows) {
            list.innerHTML = rows.length ? rows.map(function (n) {
                return '<a href="' + esc(n.link || '#/notifications') + '" class="notif-item' + (n.is_read ? '' : ' unread') + '"><div class="fw-semibold small">' + esc(n.title) +
                    '</div><div class="small text-body-secondary text-truncate">' + esc(n.message) + '</div><div class="xsmall text-body-tertiary">' + timeAgo(n.created_at) + '</div></a>';
            }).join('') : '<div class="text-center text-body-secondary small py-4"><i class="bi bi-bell-slash fs-4 d-block mb-1"></i>Tiada notifikasi</div>';
            if (rows.some(function (n) { return !n.is_read; })) api('notifications.read', {});
        }).catch(showError);
    }

    /* ------------------------------------------------------------------
     * Router
     * ------------------------------------------------------------------ */
    function parseHash() {
        var h = location.hash.replace(/^#\/?/, '');
        var parts = h.split('?');
        var params = {};
        (parts[1] || '').split('&').forEach(function (kv) {
            if (!kv) return;
            var p = kv.split('=');
            params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
        });
        return { page: parts[0] || 'dashboard', params: params };
    }

    function route() {
        if (!S.user) return;
        var r = parseHash();
        var def = S.routes[r.page];
        if (!def) { go('dashboard'); return; }
        if (def.admin && S.user.role !== 'admin') { toast('Anda tidak mempunyai kebenaran untuk halaman tersebut.', 'warning'); go('dashboard'); return; }
        S.active = def.nav || r.page;
        renderNav();
        document.body.classList.remove('sidebar-open');
        var view = $('#view');
        var seq = ++S.routeSeq;
        view.innerHTML = '<div class="view-loading"><span class="spinner-border spinner-border-sm"></span> Memuatkan…</div>';
        window.scrollTo(0, 0);
        document.title = def.title + ' · ' + (S.settings.system_name || '');
        var ctx = { params: r.params, view: view, alive: function () { return seq === S.routeSeq; } };
        Promise.resolve().then(function () { return def.render(ctx); }).catch(function (err) {
            if (!ctx.alive()) return;
            view.innerHTML = empty('exclamation-octagon', err.message || 'Ralat memuatkan halaman.', '<button class="btn btn-sm btn-primary" onclick="App.reload()">Cuba lagi</button>');
        });
    }

    function addRoute(name, def) { S.routes[name] = def; }

    /* ------------------------------------------------------------------
     * Charts
     * ------------------------------------------------------------------ */
    function chartDefaults() {
        if (!window.Chart) return false;
        var dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
        Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
        Chart.defaults.color = dark ? '#94a3b8' : '#64748b';
        Chart.defaults.borderColor = dark ? 'rgba(148,163,184,.12)' : 'rgba(15,23,42,.06)';
        Chart.defaults.plugins.legend.display = false;
        Chart.defaults.maintainAspectRatio = false;
        return true;
    }
    function canvas(id) {
        var c = document.getElementById(id);
        if (!c) return null;
        c.parentNode.style.position = 'relative';
        c.parentNode.style.height = (c.getAttribute('height') || 240) + 'px';
        return c;
    }
    var charts = {
        line: function (id, labels, data) {
            var c = canvas(id); if (!c || !chartDefaults()) return;
            var g = c.getContext('2d').createLinearGradient(0, 0, 0, 220);
            g.addColorStop(0, 'rgba(59,130,246,.35)'); g.addColorStop(1, 'rgba(59,130,246,0)');
            new Chart(c, { type: 'line', data: { labels: labels, datasets: [{ data: data, borderColor: '#3b82f6', backgroundColor: g, fill: true, tension: .35, pointRadius: 4, pointBackgroundColor: '#fff', pointBorderWidth: 2 }] },
                options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false } } } } });
        },
        bar: function (id, labels, data, colors, titles) {
            var c = canvas(id); if (!c || !chartDefaults()) return;
            new Chart(c, { type: 'bar', data: { labels: labels, datasets: [{ data: data, backgroundColor: colors || '#3b82f6', borderRadius: 6, maxBarThickness: 36 }] },
                options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false } } },
                    plugins: { tooltip: { callbacks: { title: function (it) { return titles ? titles[it[0].dataIndex] : it[0].label; } } } } } });
        },
        doughnut: function (id, labels, data, colors) {
            var c = canvas(id); if (!c || !chartDefaults()) return;
            new Chart(c, { type: 'doughnut', data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 0 }] },
                options: { cutout: '68%', plugins: { legend: { display: true, position: 'bottom', labels: { usePointStyle: true, padding: 16 } } } } });
        },
    };

    var VENDOR = (window.APP_CONFIG || {}).cdn ? {
        chart: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
        fullcalendar: 'https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js',
        fullcalendarLocale: 'https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/ms.global.min.js',
    } : {
        chart: '/assets/vendor/chartjs/chart.umd.min.js',
        fullcalendar: '/assets/vendor/fullcalendar/index.global.min.js',
        fullcalendarLocale: '/assets/vendor/fullcalendar/locale-ms.global.min.js',
    };

    function displayUrl() {
        return IN_GAS ? CFG.gasUrl + '?page=display&s=' + encodeURIComponent(S.school) : '/display.html?s=' + encodeURIComponent(S.school);
    }

    function loadScript(src) {
        return new Promise(function (resolve, reject) {
            if (document.querySelector('script[src="' + src + '"]')) return resolve();
            var s = document.createElement('script');
            s.src = src; s.onload = resolve; s.onerror = function () { reject(new Error('Gagal memuatkan ' + src)); };
            document.head.appendChild(s);
        });
    }

    /* ------------------------------------------------------------------
     * Global UI wiring & start
     * ------------------------------------------------------------------ */
    function wireGlobal() {
        var themeIcon = function () {
            var dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            $('#themeToggle').innerHTML = '<i class="bi bi-' + (dark ? 'sun' : 'moon-stars') + '"></i>';
        };
        themeIcon();
        $('#themeToggle').onclick = function () {
            var next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', next);
            try { localStorage.setItem('tb-theme', next); } catch (e) { /* ignore */ }
            themeIcon();
        };
        $$('[data-toggle-sidebar]').forEach(function (el) { el.onclick = function () { document.body.classList.toggle('sidebar-open'); }; });
        $('#notifBtn').addEventListener('show.bs.dropdown', loadNotifMenu);
    }

    function start() {
        if (!IN_GAS && (!CFG.gasUrl || /ISI_/.test(CFG.gasUrl))) {
            showMessage('gear', 'Konfigurasi belum lengkap', 'Sila isi <code>config.js</code> dengan URL Web App Google Apps Script. Rujuk <code>firebase-gas/README.md</code>.');
            return;
        }
        if (isPlatformPage()) {
            window.Platform.start();
            return;
        }
        if (!S.school) {
            showLanding();
            return;
        }
        wireGlobal();
        loadConfig().then(function () {
            return getToken() ? startSession() : showLogin();
        }).catch(function (err) {
            if (err.code === 'SCHOOL_NOT_FOUND') return showLanding('Kod sekolah "' + S.school + '" tidak dijumpai. Sila semak dengan pentadbir sekolah anda.');
            if (err.code === 'SCHOOL_SUSPENDED') {
                return showMessage('pause-circle', 'Akaun digantung', esc(err.message), '<a href="#" class="btn btn-light mt-2" onclick="event.preventDefault();App.goTop(App.homeLink())">Pilih sekolah lain</a>');
            }
            showMessage('wifi-off', 'Tidak dapat menghubungi pelayan', esc(err.message), '<button class="btn btn-primary mt-2" onclick="location.reload()">Cuba lagi</button>');
        });
    }

    return {
        S: S, $: $, $$: $$, esc: esc, pad: pad, toMin: toMin, toTime: toTime, isoDate: isoDate, todayIso: todayIso, nowMin: nowMin, addDays: addDays,
        DAYS: DAYS, MONTHS: MONTHS, MONTHS_SHORT: MONTHS_SHORT, fmtDate: fmtDate, fmtDateTime: fmtDateTime, dayName: dayName, duration: duration,
        timeAgo: timeAgo, initials: initials, debounce: debounce, STATUS: STATUS, ROOM_STATUS: ROOM_STATUS, APPROVAL_MODES: APPROVAL_MODES,
        statusBadge: statusBadge, roomStatusBadge: roomStatusBadge, roomNeedsApproval: roomNeedsApproval, room: room, dot: dot, empty: empty,
        pageTitle: pageTitle, brandLogo: brandLogo, setLogo: setLogo, link: link, go: go, formData: formData, busy: busy, csvDownload: csvDownload, pager: pager,
        toast: toast, confirm: confirmBox, showError: showError, api: api, route: addRoute, reload: route, refreshSession: refreshSession,
        charts: charts, loadScript: loadScript, vendor: VENDOR, displayUrl: displayUrl, start: start,
        showAuth: showAuth, goTop: goTop, homeLink: homeLink, schoolLink: schoolLink, IN_GAS: IN_GAS, CFG: CFG,
    };
})();

</script>
<script>
/* Sistem Tempahan Bilik Khas — teacher-facing pages */
(function (A) {
    'use strict';
    var $ = A.$, $$ = A.$$, esc = A.esc, S = A.S;
    

    function dateTile(b) {

    /* ==================================================================

    A.route('dashboard', { title: 'Papan Pemuka', render: function (ctx) {

            var icons = [['calendar-check', 'primary'], ['hourglass-split', 'warning'], ['graph-up-arrow', 'success'], [admin ? 'people' : 'door-open', 'info']];
            var links = admin ? ['#/admin/bookings', '#/admin/bookings?status=pending', '#/admin/reports', '#/admin/users'] : ['#/my-bookings', '#/my-bookings', '#/my-bookings?tab=all', '#/availability'];
            var h = '<div class="hero-card mb-4"><div class="row align-items-center g-3"><div class="col-lg-7">' +

                '</p></div><div class="col-lg-5"><div class="d-flex flex-wrap gap-2 justify-content-lg-end">' +
                '<a href="#/book" class="btn btn-white fw-semibold"><i class="bi bi-plus-lg me-1"></i>Tempah Bilik</a>' +
                '<a href="#/availability" class="btn btn-outline-light"><i class="bi bi-search me-1"></i>Semak Kekosongan</a>' +
                '<a href="#/calendar" class="btn btn-outline-light"><i class="bi bi-calendar3 me-1"></i>Jadual</a></div></div></div></div>';

            h += '<div class="row g-3 mb-4">' + labels.map(function (l, i) {

            h += '<div class="card mb-4"><div class="card-header d-flex justify-content-between align-items-center"><h2 class="card-title"><i class="bi bi-clock-history text-primary me-2"></i>Jadual Hari Ini</h2><a href="#/calendar?view=day" class="btn btn-sm btn-light">Paparan kalendar</a></div><div class="card-body">' +

    function bookingForm(ctx, editing) {

        function roomInfo() {

            $('#riCapacity').textContent = r.capacity;
            $('#riPic').innerHTML = r.pic_name ? '<i class="bi bi-person-badge me-1"></i>' + esc(r.pic_name) : '';
            $('#riFacilities').innerHTML = String(r.facilities || '').split(',').map(function (f) { return f.trim(); }).filter(Boolean).map(function (f) { return '<span class="facility-tag">' + esc(f) + '</span>'; }).join('');
            $('#riApproval').hidden = !(A.roomNeedsApproval(r) && S.user.role !== 'admin');
            capacityHint();
        }
        function capacityHint() {
            var r = A.room(room.value), n = +$('#attendees').value, hint = $('#capacityHint');
            if (!r || !n) { hint.textContent = ''; hint.className = 'form-text'; return; }
            var over = r.capacity > 0 && n > r.capacity;
            hint.textContent = over ? 'Melebihi kapasiti (' + r.capacity + ')' : 'Kapasiti: ' + r.capacity;
            hint.className = 'form-text ' + (over ? 'text-danger fw-semibold' : '');
        }
        var isToday = function () { return date.value === A.todayIso(); };
        function paintChips() {
            chips.forEach(function (c) {
                var cs = c.dataset.start, ce = c.dataset.end;
                var busyC = dayClosed || dayBookings.some(function (b) { return b.start < ce && b.end > cs; });
                var past = !date.value || date.value < A.todayIso() || (isToday() && A.toMin(ce) <= A.nowMin());
                c.classList.toggle('busy', !!busyC);
                c.classList.toggle('past', past);
                c.classList.toggle('selected', !!(start.value && end.value && cs >= start.value && ce <= end.value));
                c.classList.toggle('anchor', c === anchor);
                c.title = busyC ? 'Telah ditempah' : '';
            });
        }
        function paintDuration() {
            $('#durationBox span').textContent = start.value && end.value && end.value > start.value ? A.duration(start.value, end.value) : '—';
        }
        function paintTimeline() {
            var el = $('#dayTimeline');
            $('#dayTitle').textContent = date.value ? A.fmtDate(date.value, true) : '';
            if (!room.value || !date.value) { el.innerHTML = A.empty('door-closed', 'Pilih bilik dan tarikh untuk melihat jadual.'); return; }
            if (dayClosed) { el.innerHTML = '<div class="dt-closed"><i class="bi bi-lock fs-4 d-block mb-1"></i>Bilik ditutup pada tarikh ini:<br><strong>' + esc(dayClosed) + '</strong></div>'; return; }
            var from = Math.floor(A.toMin(dayOpen) / 60) * 60, to = Math.ceil(A.toMin(dayClose) / 60) * 60, PX = 42;
            var y = function (t) { return (A.toMin(t) - from) / 60 * PX; };
            var html = '<div class="dt-grid" style="height:' + ((to - from) / 60 * PX) + 'px">';
            for (var m = from; m < to; m += 60) html += '<div class="dt-hour" style="height:' + PX + 'px"><span>' + A.toTime(m) + '</span></div>';
            dayBookings.forEach(function (b) {
                html += '<div class="dt-block ' + (b.status === 'pending' ? 'pending' : '') + '" style="top:' + y(b.start) + 'px;height:' + Math.max(16, y(b.end) - y(b.start)) + 'px" title="' + esc(b.purpose + ' — ' + b.user) + '"><strong>' + b.start + '–' + b.end + '</strong> ' + esc(b.purpose) + ' <span class="opacity-75">· ' + esc(b.user) + '</span></div>';
            });
            if (start.value && end.value && end.value > start.value) {
                var clash = dayBookings.some(function (b) { return b.start < end.value && b.end > start.value; });
                html += '<div class="dt-block mine-sel' + (clash ? ' clash' : '') + '" style="top:' + y(start.value) + 'px;height:' + Math.max(16, y(end.value) - y(start.value)) + 'px"><strong>' + (clash ? 'Bertembung!' : 'Pilihan anda') + '</strong> ' + start.value + '–' + end.value + '</div>';
            }
            if (isToday() && A.nowMin() >= from && A.nowMin() <= to) html += '<div class="dt-now" style="top:' + ((A.nowMin() - from) / 60 * PX) + 'px"></div>';
            el.innerHTML = html + '</div>';
        }
        function paintAll() { paintChips(); paintDuration(); paintTimeline(); }
        function loadDay() {
            $('#dateLabel').textContent = date.value ? A.fmtDate(date.value, true) : '';
            if (!room.value || !date.value) { dayBookings = []; dayClosed = null; paintAll(); return; }
            $('#dayTimeline').innerHTML = '<div class="view-loading" style="min-height:120px"><span class="spinner-border spinner-border-sm"></span></div>';
            A.api('availability', { date: date.value, room_id: room.value, exclude: exclude }).then(function (res) {
                if (!ctx.alive()) return;
                dayBookings = res.bookings; dayClosed = res.closures[room.value] || null; dayOpen = res.open; dayClose = res.close;

        var seq = 0;

            if (!room.value || !date.value || !start.value || !end.value) { result.hidden = true; submit.disabled = false; return; }
            var weeks = repeat && repeat.checked ? +repeatWeeks.value : 1, my = ++seq;
            result.hidden = false;
            result.className = 'check-result mt-3 loading';
            result.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyemak kekosongan…';
            A.api('check', { room_id: room.value, date: date.value, start: start.value, end: end.value, repeat_weeks: weeks, exclude: exclude }).then(function (res) {
                if (my !== seq || !ctx.alive()) return;
                if (res.ok) {
                    result.className = 'check-result mt-3 ok';
                    result.innerHTML = '<i class="bi bi-check-circle-fill fs-5"></i><div><strong>Slot tersedia!</strong> ' + (weeks > 1 ? 'Kesemua ' + weeks + ' minggu kosong. ' : '') +
                        (res.approval ? 'Tempahan akan menunggu kelulusan pentadbir.' : 'Tempahan akan disahkan serta-merta.') + '</div>';
                    submit.disabled = false;
                } else {
                    result.className = 'check-result mt-3 bad';
                    result.innerHTML = '<i class="bi bi-x-octagon-fill fs-5"></i><div><strong>Tidak boleh ditempah:</strong><ul>' + res.errors.slice(0, 8).map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
                    submit.disabled = true;
                }
            }).catch(function () { result.hidden = true; submit.disabled = false; });
        }, 350);

        chips.forEach(function (c, idx) {
            c.onclick = function () {
                if (c.classList.contains('past')) return;
                if (anchor && anchor !== c) {
                    var a = chips.indexOf(anchor), lo = Math.min(a, idx), hi = Math.max(a, idx);
                    start.value = chips[lo].dataset.start; end.value = chips[hi].dataset.end; anchor = null;

                    start.value = c.dataset.start; end.value = c.dataset.end; anchor = c;

        });
        [start, end].forEach(function (i) { i.onchange = function () { anchor = null; paintAll(); check(); }; });
        room.onchange = function () { roomInfo(); loadDay(); };
        date.onchange = function () { loadDay(); summary(); };
        $('#attendees').oninput = capacityHint;
        function summary() {
            if (!repeat) return;

        form.onsubmit = function (e) {

                    (b.status !== 'rejected' ? '<button class="btn btn-outline-danger" data-status="rejected"><i class="bi bi-x-lg me-1"></i>Tolak</button>' : '') + '</div></div></div>';
            }
            if (b.can_modify) {
                h += '<div class="card mb-4"><div class="card-header"><h2 class="card-title"><i class="bi bi-gear me-2"></i>Urus Tempahan</h2></div><div class="card-body d-grid gap-2">' +
                    '<a href="#/book?id=' + b.id + '" class="btn btn-light"><i class="bi bi-pencil me-1"></i>Pinda tempahan</a>' +
                    '<button class="btn btn-outline-danger" data-cancel="one"><i class="bi bi-x-circle me-1"></i>Batalkan tempahan ini</button>' +
                    (b.active_series > 1 ? '<button class="btn btn-outline-danger" data-cancel="series"><i class="bi bi-calendar-x me-1"></i>Batalkan seluruh siri (' + b.active_series + ')</button>' : '') + '</div></div>';
            }
            h += '<div class="card"><div class="card-header"><h2 class="card-title"><i class="bi bi-clock-history me-2"></i>Sejarah</h2></div><div class="card-body"><ul class="mini-timeline">' +
                '<li><strong>Dibuat</strong><span>' + A.fmtDateTime(b.created_at) + '</span></li>' + (b.updated_at && b.updated_at !== b.created_at ? '<li><strong>Kemas kini terakhir</strong><span>' + A.fmtDateTime(b.updated_at) + '</span></li>' : '') +
                (b.reviewed_at ? '<li><strong>Disemak oleh ' + esc(b.reviewer_name) + '</strong><span>' + A.fmtDateTime(b.reviewed_at) + '</span></li>' : '') +
                '<li><strong>Status semasa</strong><span>' + A.statusBadge(b.status) + '</span></li></ul></div></div></div></div>';
            ctx.view.innerHTML = h;

            var setStatus = function (status, scope, remark, btn) {
                A.busy(btn, true);
                A.api('booking.setStatus', { id: b.id, status: status, scope: scope, remark: remark }).then(function (r) {
                    var verb = { approved: 'diluluskan', rejected: 'ditolak', cancelled: 'dibatalkan' }[status];
                    if (r.done) A.toast(r.done > 1 ? r.done + ' tempahan telah ' + verb + '.' : 'Tempahan ' + b.ref_no + ' telah ' + verb + '.');
                    if (r.errors.length) A.toast(r.errors.join(' '), 'danger');
                    A.reload();
                }).catch(function (e) { A.busy(btn, false); A.showError(e); });
            };
            $$('[data-status]', ctx.view).forEach(function (btn) {
                btn.onclick = function () { setStatus(btn.dataset.status, ($('#scope') || {}).value || 'one', $('#remark').value.trim(), btn); };
            });
            $$('[data-cancel]', ctx.view).forEach(function (btn) {
                btn.onclick = function () {
                    var series = btn.dataset.cancel === 'series';
                    A.confirm(series ? 'Batalkan SEMUA ' + b.active_series + ' tempahan akan datang dalam siri ini?' : 'Batalkan tempahan ini? Slot akan dibuka semula kepada guru lain.')
                        .then(function (ok) { if (ok) setStatus('cancelled', series ? 'series' : 'one', '', btn); });
                };
            });
            $('#icsBtn').onclick = function () {
                var st = function (t) { return b.date.replace(/-/g, '') + 'T' + t.replace(':', '') + '00'; };
                var e = function (s) { return String(s || '').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n'); };
                var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tempahan Bilik//MS', 'BEGIN:VEVENT', 'UID:' + b.ref_no + '@tempahanbilik',
                    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART;TZID=Asia/Kuala_Lumpur:' + st(b.start_time), 'DTEND;TZID=Asia/Kuala_Lumpur:' + st(b.end_time),
                    'SUMMARY:' + e(b.room_name + ' – ' + b.purpose), 'LOCATION:' + e(b.room_location), 'DESCRIPTION:' + e('No. rujukan: ' + b.ref_no), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
                var a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
                a.download = 'tempahan-' + b.ref_no + '.ics';
                document.body.appendChild(a); a.click(); a.remove();
            };
        });
    } });

    /* ==================================================================
     * Rooms gallery

    A.route('rooms', { title: 'Senarai Bilik Khas', render: function (ctx) {
        return A.api('availability', { date: A.todayIso() }).then(function (d) {
            if (!ctx.alive()) return;
            var nowT = A.toTime(A.nowMin());
            var rooms = S.rooms.filter(function (r) { return r.status !== 'inactive'; });
            var cats = rooms.map(function (r) { return r.category; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; });
            ctx.view.innerHTML = A.pageTitle('Senarai Bilik Khas', rooms.length + ' bilik khas di ' + esc(S.settings.school_name) + '.') +
                '<div class="d-flex flex-wrap gap-2 mb-4 filter-chips" id="roomFilter"><button class="btn btn-sm btn-primary" data-filter="">Semua</button>' +
                cats.map(function (c) { return '<button class="btn btn-sm btn-light" data-filter="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
                '<div class="ms-auto input-icon" style="min-width:220px"><i class="bi bi-search"></i><input class="form-control form-control-sm" id="roomSearch" placeholder="Cari bilik…"></div></div>' +
                '<div class="row g-4" id="roomGrid">' + rooms.map(function (r) {
                    var list = d.bookings.filter(function (b) { return b.room_id === r.id; });
                    var busyNow = list.some(function (b) { return b.start <= nowT && b.end > nowT; });
                    var closed = d.closures[r.id];
                    var badge = r.status !== 'active' || closed ? '<span class="badge text-bg-dark"><i class="bi bi-lock me-1"></i>' + (closed ? 'Ditutup hari ini' : 'Penyelenggaraan') + '</span>'
                        : busyNow ? '<span class="badge text-bg-danger">Sedang digunakan</span>' : '<span class="badge text-bg-success">Kosong sekarang</span>';
                    return '<div class="col-md-6 col-xl-4" data-category="' + esc(r.category) + '" data-search="' + esc([r.name, r.code, r.location, r.facilities].join(' ').toLowerCase()) + '"><div class="room-card h-100">' +
                        '<div class="room-card-banner" style="--c:' + esc(r.color) + '"><span class="room-code">' + esc(r.code) + '</span><i class="bi bi-door-open"></i><span class="room-live">' + badge + '</span></div>' +
                        '<div class="p-4 d-flex flex-column h-100"><div class="d-flex justify-content-between align-items-start gap-2 mb-1"><h3 class="h5 fw-bold mb-0">' + esc(r.name) + '</h3>' +
                        (A.roomNeedsApproval(r) ? '<span class="badge badge-soft-warning" title="Perlu kelulusan pentadbir"><i class="bi bi-shield-lock"></i></span>' : '') + '</div>' +
                        '<div class="small text-body-secondary mb-3">' + esc(r.category) + ' · <i class="bi bi-geo-alt"></i> ' + esc(r.location) + '</div>' +
                        '<div class="d-flex gap-3 small mb-3"><span><i class="bi bi-people me-1 text-primary"></i>' + r.capacity + ' orang</span><span><i class="bi bi-calendar-check me-1 text-primary"></i>' + list.length + ' tempahan hari ini</span></div>' +
                        '<div class="d-flex flex-wrap gap-1 mb-3">' + String(r.facilities || '').split(',').map(function (f) { return f.trim(); }).filter(Boolean).map(function (f) { return '<span class="facility-tag">' + esc(f) + '</span>'; }).join('') + '</div>' +
                        (r.description ? '<p class="small text-body-secondary">' + esc(r.description) + '</p>' : '') + (r.pic_name ? '<div class="xsmall text-body-secondary mb-3"><i class="bi bi-person-badge me-1"></i>Penyelaras: ' + esc(r.pic_name) + '</div>' : '') +
                        '<div class="mt-auto d-flex gap-2">' + (r.status === 'active' ? '<a href="' + A.link('book', { room_id: r.id }) + '" class="btn btn-primary flex-grow-1"><i class="bi bi-plus-lg me-1"></i>Tempah</a>' : '') +
                        '<a href="' + A.link('calendar', { room_id: r.id }) + '" class="btn btn-light flex-grow-1"><i class="bi bi-calendar3 me-1"></i>Jadual</a></div></div></div></div>';
                }).join('') + '</div><div id="roomEmpty" hidden>' + A.empty('search', 'Tiada bilik sepadan dengan carian.') + '</div>';
            var cat = '', term = '';
            var apply = function () {
                var shown = 0;
                $$('#roomGrid > [data-category]').forEach(function (c) {
                    var ok = (!cat || c.dataset.category === cat) && (!term || c.dataset.search.indexOf(term) !== -1);
                    c.hidden = !ok; if (ok) shown++;
                });
                $('#roomEmpty').hidden = shown > 0;
            };
            $$('#roomFilter [data-filter]').forEach(function (b) {
                b.onclick = function () {
                    cat = b.dataset.filter;
                    $$('#roomFilter [data-filter]').forEach(function (x) { x.className = 'btn btn-sm ' + (x === b ? 'btn-primary' : 'btn-light'); });
                    apply();
                };
            });
            $('#roomSearch').oninput = function () { term = this.value.trim().toLowerCase(); apply(); };
        });
    } });

    /* ==================================================================
     * Notifications & profile
     * ================================================================== */
    A.route('notifications', { title: 'Notifikasi', render: function (ctx) {
        return A.api('notifications', { limit: 100 }).then(function (rows) {
            if (!ctx.alive()) return;
            ctx.view.innerHTML = A.pageTitle('Notifikasi', 'Makluman berkaitan tempahan anda.', '<button class="btn btn-light" id="readAll"><i class="bi bi-check2-all me-1"></i>Tanda semua dibaca</button><button class="btn btn-light text-danger" id="clearRead"><i class="bi bi-trash me-1"></i>Padam yang dibaca</button>') +
                '<div class="card">' + (rows.length ? '<div class="list-group list-group-flush">' + rows.map(function (n) {
                    var icon = /Ditolak/.test(n.title) ? 'x-circle text-danger' : /Diluluskan|diaktifkan/.test(n.title) ? 'check-circle text-success' : 'bell text-primary';
                    return '<a href="' + esc(n.link || '#/notifications') + '" class="list-group-item list-group-item-action d-flex gap-3 py-3' + (n.is_read ? '' : ' notif-unread') + '"><div class="notif-icon"><i class="bi bi-' + icon + '"></i></div>' +
                        '<div class="flex-grow-1"><div class="d-flex justify-content-between gap-2"><strong>' + esc(n.title) + '</strong><span class="xsmall text-body-secondary text-nowrap">' + A.timeAgo(n.created_at) + '</span></div><div class="small text-body-secondary">' + esc(n.message) + '</div></div></a>';
                }).join('') + '</div>' : A.empty('bell-slash', 'Tiada notifikasi.')) + '</div>';
            $('#readAll').onclick = function () { A.api('notifications.read', {}).then(function () { A.toast('Semua notifikasi ditanda sebagai dibaca.'); A.reload(); }).catch(A.showError); };
            $('#clearRead').onclick = function () { A.api('notifications.clear', {}).then(function (n) { A.toast(n + ' notifikasi dipadam.'); A.reload(); }).catch(A.showError); };
        });
    } });

    A.route('profile', { title: 'Profil Saya', render: function (ctx) {
        var u = S.user;
        ctx.view.innerHTML = A.pageTitle('Profil Saya', 'Urus maklumat akaun dan kata laluan anda.') +
            '<div class="row g-4"><div class="col-lg-4"><div class="card text-center"><div class="card-body p-4">' +
            '<div class="avatar avatar-xl mx-auto mb-3">' + esc(A.initials(u.name)) + '</div>' +
            '<h2 class="h5 fw-bold mb-0">' + esc(u.name) + '</h2><div class="text-body-secondary small mb-2">' + esc(u.department || '') + '</div><span class="badge badge-soft-primary">' + (u.role === 'admin' ? 'Pentadbir' : 'Guru') + '</span>' +
            '<div class="xsmall text-body-tertiary mt-3">Log masuk terakhir: ' + A.fmtDateTime(u.last_login_at) + '</div></div></div></div>' +
            '<div class="col-lg-8"><div class="card mb-4"><div class="card-header"><h2 class="card-title">Maklumat Peribadi</h2></div><div class="card-body"><form id="profileForm"><div class="row g-3">' +
            '<div class="col-md-6"><label class="form-label fw-semibold">Nama penuh</label><input class="form-control" name="name" value="' + esc(u.name) + '" required></div>' +
            '<div class="col-md-6"><label class="form-label fw-semibold">Panitia / Unit</label><input class="form-control" name="department" value="' + esc(u.department) + '"></div>' +
            '<div class="col-md-6"><label class="form-label fw-semibold">E-mel <span class="fw-normal text-body-secondary">(untuk notifikasi)</span></label><input type="email" class="form-control" name="email" value="' + esc(u.email) + '"></div>' +
            '<div class="col-md-6"><label class="form-label fw-semibold">No. telefon</label><input class="form-control" name="phone" value="' + esc(u.phone) + '"></div></div>' +
            '<button class="btn btn-primary mt-3">Simpan</button></form></div></div>' +
            '<div class="card"><div class="card-header"><h2 class="card-title">Tukar Kata Laluan</h2></div><div class="card-body">' +
            '<p class="small text-body-secondary">Secara lalai, kata laluan anda ialah No. Kad Pengenalan. Anda boleh menukarnya kepada kata laluan lain (sekurang-kurangnya 6 aksara).</p>' +
            '<form id="pwForm" autocomplete="off"><div class="row g-3">' +
            '<div class="col-md-4"><label class="form-label fw-semibold">Kata laluan semasa</label><input type="password" class="form-control" name="current" required></div>' +
            '<div class="col-md-4"><label class="form-label fw-semibold">Kata laluan baharu</label><input type="password" class="form-control" name="password" minlength="6" required></div>' +
            '<div class="col-md-4"><label class="form-label fw-semibold">Sahkan kata laluan</label><input type="password" class="form-control" name="confirm" minlength="6" required></div></div>' +
            '<button class="btn btn-primary mt-3">Tukar Kata Laluan</button></form></div></div></div></div>';
        $('#profileForm').onsubmit = function (e) {
            e.preventDefault();
            var btn = $('button', this);
            A.busy(btn, true);
            A.api('profile.update', A.formData(this)).then(function (nu) {
                Object.assign(S.user, nu);
                A.toast('Profil berjaya dikemas kini.');
                A.busy(btn, false);
            }).catch(function (err) { A.busy(btn, false); A.showError(err); });
        };
        $('#pwForm').onsubmit = function (e) {
            e.preventDefault();
            var d = A.formData(this), form = this, btn = $('button', this);
            if (d.password !== d.confirm) { A.toast('Pengesahan kata laluan tidak sepadan.', 'warning'); return; }
            A.busy(btn, true);
            A.api('password.change', d).then(function () {
                A.toast('Kata laluan berjaya ditukar.');
                form.reset();
                A.busy(btn, false);
            }).catch(function (err) { A.busy(btn, false); A.showError(err); });
        };
    } });
})(window.App);

</script>
<script>
/* Sistem Tempahan Bilik Khas — admin pages */
(function (A) {
    'use strict';
    var $ = A.$, $$ = A.$$, esc = A.esc, S = A.S;

    function opt(value, label, selected) {
        return '<option value="' + esc(value) + '"' + (String(selected) === String(value) ? ' selected' : '') + '>' + esc(label) + '</option>';
    }

    /* ==================================================================
     * Booking records
     * ================================================================== */
    A.route('admin/bookings', { title: 'Rekod Tempahan', admin: true, render: function (ctx) {
        var f = ctx.params;
        return Promise.all([A.api('admin.bookings', f), A.api('admin.users.list')]).then(function (res) {
            if (!ctx.alive()) return;
            var d = res[0], users = res[1];
            var h = A.pageTitle('Rekod Tempahan', 'Semak, luluskan dan urus semua tempahan bilik khas.',
                '<button class="btn btn-light" id="exportCsv"><i class="bi bi-filetype-csv me-1"></i>Eksport CSV</button><button class="btn btn-light" onclick="window.print()"><i class="bi bi-printer me-1"></i>Cetak</button>') +
                '<div class="d-flex flex-wrap gap-2 mb-3 no-print"><a href="#/admin/bookings" class="btn btn-sm ' + (!f.status ? 'btn-primary' : 'btn-light') + '">Semua <span class="opacity-75">(' + d.counts.all + ')</span></a>' +
                Object.keys(A.STATUS).map(function (k) {
                    return '<a href="' + A.link('admin/bookings', { status: k }) + '" class="btn btn-sm ' + (f.status === k ? 'btn-' + A.STATUS[k][1] : 'btn-light') + '">' + A.STATUS[k][0] + ' <span class="opacity-75">(' + (d.counts[k] || 0) + ')</span></a>';
                }).join('') + '</div>' +
                '<div class="card mb-3 no-print"><div class="card-body"><form class="row g-2 align-items-end" id="filters">' +
                '<input type="hidden" name="status" value="' + esc(f.status || '') + '">' +
                '<div class="col-6 col-md-2"><label class="form-label small fw-semibold">Dari</label><input type="date" name="from" class="form-control form-control-sm" value="' + esc(f.from || '') + '"></div>' +
                '<div class="col-6 col-md-2"><label class="form-label small fw-semibold">Hingga</label><input type="date" name="to" class="form-control form-control-sm" value="' + esc(f.to || '') + '"></div>' +
                '<div class="col-md-2"><label class="form-label small fw-semibold">Bilik</label><select name="room_id" class="form-select form-select-sm"><option value="">Semua</option>' + S.rooms.map(function (r) { return opt(r.id, r.name, f.room_id); }).join('') + '</select></div>' +
                '<div class="col-md-2"><label class="form-label small fw-semibold">Guru</label><select name="user_id" class="form-select form-select-sm"><option value="">Semua</option>' + users.map(function (u) { return opt(u.id, u.name, f.user_id); }).join('') + '</select></div>' +
                '<div class="col-md-2"><label class="form-label small fw-semibold">Carian</label><input name="q" class="form-control form-control-sm" value="' + esc(f.q || '') + '" placeholder="No. rujukan, tujuan…"></div>' +
                '<div class="col-md-2 d-flex gap-1"><button class="btn btn-sm btn-primary flex-grow-1"><i class="bi bi-funnel me-1"></i>Tapis</button><a href="#/admin/bookings" class="btn btn-sm btn-light" title="Set semula"><i class="bi bi-arrow-counterclockwise"></i></a></div></form></div></div>' +
                '<div class="card"><div class="card-header d-flex flex-wrap gap-2 align-items-center no-print bulk-bar"><span class="small text-body-secondary"><span id="selCount">0</span> dipilih</span>' +
                '<input id="bulkRemark" class="form-control form-control-sm" style="max-width:260px" placeholder="Catatan (pilihan)">' +
                '<button data-bulk="approved" class="btn btn-sm btn-success"><i class="bi bi-check-lg me-1"></i>Luluskan</button><button data-bulk="rejected" class="btn btn-sm btn-outline-danger"><i class="bi bi-x-lg me-1"></i>Tolak</button>' +
                '<button data-bulk="cancelled" class="btn btn-sm btn-outline-secondary"><i class="bi bi-slash-circle me-1"></i>Batalkan</button><span class="ms-auto small text-body-secondary">' + d.total + ' rekod</span></div>' +
                '<div class="print-only p-3"><h2 class="h5 mb-0">Rekod Tempahan Bilik Khas – ' + esc(S.settings.school_name) + '</h2><div class="small">Dicetak pada ' + A.fmtDate(A.todayIso()) + '</div></div>' +
                (d.rows.length ? '<div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th class="no-print" style="width:36px"><input type="checkbox" class="form-check-input" id="checkAll"></th><th>Rujukan</th><th>Tarikh &amp; Masa</th><th>Bilik</th><th>Guru</th><th>Tujuan</th><th>Status</th><th class="no-print"></th></tr></thead><tbody>' +
                    d.rows.map(function (b) {
                        return '<tr><td class="no-print"><input type="checkbox" class="form-check-input row-check" value="' + b.id + '"></td><td class="font-monospace small">' + esc(b.ref_no) + '</td>' +
                            '<td class="text-nowrap"><div class="fw-semibold small">' + A.fmtDate(b.date, true, true) + '</div><div class="xsmall text-body-secondary">' + b.start_time + ' – ' + b.end_time + '</div></td>' +
                            '<td class="small">' + A.dot(b.room_color) + esc(b.room_name) + '</td><td class="small">' + esc(b.user_name) + '</td>' +
                            '<td class="small">' + esc(b.purpose) + (b.class_name ? '<div class="xsmall text-body-secondary">' + esc(b.class_name) + (b.subject ? ' · ' + esc(b.subject) : '') + '</div>' : '') + '</td>' +
                            '<td>' + A.statusBadge(b.status) + '</td><td class="text-end no-print"><a href="#/booking?id=' + b.id + '" class="btn btn-sm btn-light"><i class="bi bi-chevron-right"></i></a></td></tr>';
                    }).join('') + '</tbody></table></div><div class="card-footer no-print">' + A.pager(d.page, d.pages, function (n) { A.go('admin/bookings', Object.assign({}, f, { page: n })); }) + '</div>'
                    : A.empty('inbox', 'Tiada rekod tempahan ditemui.')) + '</div>';
            ctx.view.innerHTML = h;

            $('#filters').onsubmit = function (e) { e.preventDefault(); A.go('admin/bookings', A.formData(this)); };
            var boxes = $$('.row-check'), all = $('#checkAll');
            var update = function () {
                var n = boxes.filter(function (b) { return b.checked; }).length;
                $('#selCount').textContent = n;
                $$('[data-bulk]').forEach(function (b) { b.disabled = !n; });
            };
            if (all) all.onchange = function () { boxes.forEach(function (b) { b.checked = all.checked; }); update(); };
            boxes.forEach(function (b) { b.onchange = update; });
            update();
            $$('[data-bulk]').forEach(function (btn) {
                btn.onclick = function () {
                    var ids = boxes.filter(function (b) { return b.checked; }).map(function (b) { return +b.value; });
                    A.busy(btn, true);
                    A.api('booking.setStatus', { ids: ids, status: btn.dataset.bulk, remark: $('#bulkRemark').value.trim() }).then(function (r) {
                        if (r.done) A.toast(r.done + ' tempahan dikemas kini.');
                        if (r.errors.length) A.toast(r.errors.slice(0, 5).join(' '), 'warning');
                        A.reload();
                    }).catch(function (e) { A.busy(btn, false); A.showError(e); });
                };
            });
            $('#exportCsv').onclick = function () {
                var btn = this;
                A.busy(btn, true);
                A.api('admin.bookings', Object.assign({}, f, { all: true })).then(function (x) {
                    A.busy(btn, false);
                    A.csvDownload('rekod-tempahan-' + A.todayIso() + '.csv',
