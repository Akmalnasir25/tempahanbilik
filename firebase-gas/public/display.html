<!doctype html>
<html lang="ms" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jadual Bilik Khas Hari Ini</title>
    <link rel="icon" href="/assets/img/logo-icon.png">
    <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/app.css?v=2" rel="stylesheet">
</head>
<body class="display-board">
<header class="db-head">
    <div class="d-flex align-items-center gap-3">
        <span class="brand-logo has-img is-default lg" id="logo"><img src="/assets/img/logo.png" alt="Logo sistem" data-default-logo></span>
        <div><div class="fs-4 fw-bold">Jadual Bilik Khas Hari Ini</div><div class="opacity-75" id="school"></div></div>
    </div>
    <div class="text-end"><div class="db-clock" id="clock">--:--</div><div class="opacity-75" id="dateLabel"></div></div>
</header>
<main class="db-grid" id="grid"><div class="opacity-75 p-4">Memuatkan…</div></main>
<script src="/config.js?v=2"></script>
<script>
(function () {
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var pad = function (n) { return String(n).padStart(2, '0'); };
    function call(payload) {
        var gsr = window.google && google.script && google.script.run;
        if (gsr) return new Promise(function (ok, fail) { gsr.withSuccessHandler(function (x) { ok(JSON.parse(x)); }).withFailureHandler(fail).api(JSON.stringify(payload)); });
        return fetch(APP_CONFIG.gasUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).then(function (r) { return r.json(); });
    }
    var cfg = window.APP_CONFIG || {};
    var norm = function (v) { return String(v || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, ''); };
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('tb-school') || 'null'); } catch (e) { /* ignore */ }
    // Same school as the main app on this device, or ask for the KPM code once.
    var school = norm(cfg.school || new URLSearchParams(location.search).get('s') || (saved && saved.code));
    function tick() { var d = new Date(); document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function load() {
        call({ action: 'display', school: school })
            .then(function (j) {
                if (!j.ok) throw new Error(j.error || 'Ralat');
                var d = j.data, now = pad(new Date().getHours()) + ':' + pad(new Date().getMinutes());
                document.getElementById('school').textContent = d.school_name;
                if (d.logo) {
                    var l = document.getElementById('logo');
                    l.className = 'brand-logo lg has-img';
                    l.innerHTML = '<img src="' + esc(d.logo) + '" alt="Logo sekolah">';
                }
                document.getElementById('dateLabel').textContent = d.dateLabel;
                document.getElementById('grid').innerHTML = d.rooms.map(function (r) {
                    var list = d.bookings.filter(function (b) { return b.room_id === r.id; });
                    var cur = list.filter(function (b) { return b.start <= now && b.end > now; })[0];
                    var state = r.closed ? 'closed' : cur ? 'busy' : 'free';
                    return '<section class="db-room ' + state + '" style="--c:' + esc(r.color) + '"><div class="d-flex justify-content-between align-items-start mb-2"><div><div class="fw-bold fs-5">' + esc(r.name) +
                        '</div><div class="small opacity-75">' + esc(r.location) + '</div></div><span class="db-state">' + { closed: 'DITUTUP', busy: 'DIGUNAKAN', free: 'KOSONG' }[state] + '</span></div>' +
                        (r.closed ? '<div class="opacity-75">' + esc(r.closed) + '</div>' : cur ? '<div class="db-now"><strong>' + esc(cur.purpose) + '</strong><div>' + esc(cur.user) + (cur.class_name ? ' · ' + esc(cur.class_name) : '') + '</div><div class="small opacity-75">hingga ' + esc(cur.end) + '</div></div>' : '') +
                        '<ul class="db-list">' + list.filter(function (b) { return b !== cur; }).map(function (b) {
                            return '<li class="' + (b.end <= now ? 'done' : '') + '"><span>' + esc(b.start) + '–' + esc(b.end) + '</span>' + esc(b.purpose) + ' <em>' + esc(b.user) + '</em></li>';
                        }).join('') + (!list.length && !r.closed ? '<li class="opacity-50">Tiada tempahan hari ini</li>' : '') + '</ul></section>';
                }).join('');
            })
            .catch(function (e) { document.getElementById('grid').innerHTML = '<div class="p-4 opacity-75">' + esc(e.message) + '</div>'; });
    }
    tick();
    setInterval(tick, 10000);
    if (!school) {
        document.getElementById('grid').innerHTML = '<form id="codeForm" class="p-4" style="max-width:420px"><label class="form-label fw-semibold" for="code">Masukkan kod sekolah</label>' +
            '<div class="d-flex gap-2"><input id="code" class="form-control form-control-lg text-uppercase" placeholder="cth. PEA1234" required><button class="btn btn-primary btn-lg">Papar</button></div></form>';
        document.getElementById('codeForm').onsubmit = function (e) {
            e.preventDefault();
            school = norm(document.getElementById('code').value);
            if (!school) return;
            try { localStorage.setItem('tb-school', JSON.stringify({ code: school })); } catch (err) { /* ignore */ }
            load();
            setInterval(load, 120000);
        };
        return;
    }
    load();
    setInterval(load, 120000);
})();
</script>
</body>
</html>
