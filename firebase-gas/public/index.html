<!doctype html>
<html lang="ms">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistem Tempahan Bilik Khas</title>
    <link rel="icon" href="assets/img/logo-icon.png">
    <link rel="apple-touch-icon" href="assets/img/logo-icon.png">
    <meta name="theme-color" content="#1e3a8a">
    <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/app.css?v=2" rel="stylesheet">
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('tb-theme'); } catch (e) {}
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
</head>
<body class="app">
<div id="boot" class="boot"><span class="brand-logo has-img is-default lg"><img src="assets/img/logo.png" alt="Logo sistem" data-default-logo></span><div class="spinner-border spinner-border-sm"></div></div>

<div id="auth" hidden></div>

<div id="shell" hidden>
    <aside class="sidebar" id="sidebar">
        <a href="#/dashboard" class="brand">
            <span class="brand-logo has-img is-default" id="sidebarLogo"><img src="assets/img/logo.png" alt="Logo sistem" data-default-logo></span>
            <span class="brand-text"><strong data-setting="system_name"></strong><small data-setting="school_name"></small></span>
        </a>
        <nav class="side-nav" id="sideNav"></nav>
        <div class="sidebar-footer">
            <a href="display.html" target="_blank" class="nav-link" id="displayLink"><i class="bi bi-tv"></i><span>Paparan Skrin Hari Ini</span></a>
        </div>
    </aside>
    <div class="sidebar-backdrop" data-toggle-sidebar></div>

    <div class="main">
        <header class="topbar">
            <button class="btn btn-icon d-lg-none" data-toggle-sidebar aria-label="Menu"><i class="bi bi-list fs-4"></i></button>
            <div class="topbar-title d-none d-md-block"><div class="text-body-secondary small" id="todayLabel"></div></div>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="#/book" class="btn btn-primary btn-sm d-none d-sm-inline-flex align-items-center gap-1"><i class="bi bi-plus-lg"></i> Tempahan Baharu</a>
                <button class="btn btn-icon" id="themeToggle" title="Tukar tema" aria-label="Tukar tema"><i class="bi bi-moon-stars"></i></button>
                <div class="dropdown">
                    <button class="btn btn-icon position-relative" data-bs-toggle="dropdown" id="notifBtn" aria-label="Notifikasi">
                        <i class="bi bi-bell"></i><span class="notif-dot" id="notifDot" hidden></span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notif-menu shadow-lg p-0">
                        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                            <strong>Notifikasi</strong><a href="#/notifications" class="small">Lihat semua</a>
                        </div>
                        <div class="notif-list" id="notifList"></div>
                    </div>
                </div>
                <div class="dropdown">
                    <button class="btn user-chip" data-bs-toggle="dropdown" id="userChip"></button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" href="#/profile"><i class="bi bi-person me-2"></i>Profil Saya</a></li>
                        <li><a class="dropdown-item" href="#/my-bookings"><i class="bi bi-journal-bookmark me-2"></i>Tempahan Saya</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><button class="dropdown-item text-danger" data-logout><i class="bi bi-box-arrow-right me-2"></i>Log Keluar</button></li>
                    </ul>
                </div>
            </div>
        </header>
        <main class="content" id="view"></main>
        <footer class="app-footer">
            <span>&copy; <span id="year"></span> <span data-setting="school_name"></span></span>
            <span class="text-body-tertiary" data-setting="system_name"></span>
        </footer>
    </div>
</div>

<!-- Shared dialogs -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body p-4 text-center">
                <div class="confirm-icon mb-3"><i class="bi bi-exclamation-triangle"></i></div>
                <h5 class="mb-2">Adakah anda pasti?</h5>
                <p class="text-body-secondary mb-0" data-confirm-text></p>
                <textarea class="form-control mt-3" rows="2" data-confirm-input hidden placeholder="Catatan (pilihan)"></textarea>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-danger px-4" data-confirm-ok>Ya, teruskan</button>
            </div>
        </div>
    </div>
</div>
<div class="toast-stack" id="toasts"></div>

<script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="config.js?v=2"></script>
<script src="assets/js/core.js?v=2"></script>
<script src="assets/js/pages.js?v=2"></script>
<script src="assets/js/admin.js?v=2"></script>
<script>App.start();</script>
</body>
</html>
